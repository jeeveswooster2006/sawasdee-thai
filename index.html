<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sawasdee Thai</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" />
<style>
  :root {
    --bg: #eef5f0;
    --card: #ffffff;
    --card-sunken: #e2ede6;
    --ink: #123b37;
    --ink-soft: #4f6b66;
    --ink-faint: #8aa39d;
    --line: #d3e3da;
    --jade: #0f8170;
    --jade-deep: #0a5f53;
    --jade-soft: #d3efe7;
    --marigold: #f2a024;
    --marigold-deep: #c97a06;
    --marigold-soft: #fdecc8;
    --lotus: #e0507a;
    --lotus-soft: #fbdbe5;
    --clay: #c8432b;
    --clay-soft: #f9ddd5;
    --sky: #3a72b8;
    --leaf: #5b9a2f;
    --shadow: 160 30% 15%;
    --tone-mid: #4f6b66;
    --tone-low: #0f8170;
    --tone-falling: #c8432b;
    --tone-high: #c97a06;
    --tone-rising: #7a4fa0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d1c1a; --card: #152c29; --card-sunken: #10231f; --ink: #e6f3ef; --ink-soft: #a9c4bd; --ink-faint: #6d8c85;
      --line: #24423d; --jade: #36c2a6; --jade-deep: #1f9a82; --jade-soft: #173d36; --marigold: #f6b84f; --marigold-deep: #d39226;
      --marigold-soft: #3d3016; --lotus: #f27b9c; --lotus-soft: #40202b; --clay: #ef7a60; --clay-soft: #3f231c; --sky: #79a7e4; --leaf: #8fcb61;
      --tone-mid: #a9c4bd; --tone-low: #36c2a6; --tone-falling: #ef7a60; --tone-high: #f6b84f; --tone-rising: #b592e0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1c1a; --card: #152c29; --card-sunken: #10231f; --ink: #e6f3ef; --ink-soft: #a9c4bd; --ink-faint: #6d8c85;
    --line: #24423d; --jade: #36c2a6; --jade-deep: #1f9a82; --jade-soft: #173d36; --marigold: #f6b84f; --marigold-deep: #d39226;
    --marigold-soft: #3d3016; --lotus: #f27b9c; --lotus-soft: #40202b; --clay: #ef7a60; --clay-soft: #3f231c; --sky: #79a7e4; --leaf: #8fcb61;
    --tone-mid: #a9c4bd; --tone-low: #36c2a6; --tone-falling: #ef7a60; --tone-high: #f6b84f; --tone-rising: #b592e0;
  }

  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Sarabun", "Leelawadee UI", ui-sans-serif, system-ui, sans-serif; font-size: 17px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: "Mitr", "Leelawadee UI", sans-serif; font-weight: 500; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
  .thai { font-family: "Mitr", "Noto Sans Thai", "Leelawadee UI", sans-serif; font-weight: 500; }
  button { font-family: inherit; color: inherit; }
  img { display: block; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 3px solid var(--marigold); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; } }

  /* chunky press-down buttons, shared by every primary action */
  .chunky {
    border: none; border-radius: 16px; cursor: pointer; font-family: "Mitr", sans-serif; font-weight: 500;
    font-size: 1.05rem; letter-spacing: 0.02em; padding: 14px 26px;
    background: var(--jade); color: #fff; box-shadow: 0 5px 0 var(--jade-deep);
    transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s;
  }
  .chunky:hover:not(:disabled) { filter: brightness(1.06); }
  .chunky:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--jade-deep); }
  .chunky.gold { background: var(--marigold); box-shadow: 0 5px 0 var(--marigold-deep); color: #3a2400; }
  .chunky.gold:active:not(:disabled) { box-shadow: 0 1px 0 var(--marigold-deep); }
  .chunky.plain { background: var(--card); color: var(--ink); box-shadow: 0 5px 0 var(--line), inset 0 0 0 2px var(--line); }
  .chunky.plain:active:not(:disabled) { box-shadow: 0 1px 0 var(--line), inset 0 0 0 2px var(--line); }
  .chunky:disabled { background: var(--card-sunken); color: var(--ink-faint); box-shadow: 0 5px 0 var(--line); cursor: not-allowed; }

  /* ---------- Top bar ---------- */
  #topbar {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 10px 20px 16px; background: var(--card);
    /* a phuang malai garland: marigold and jasmine beads with a lotus every few */
    background-image:
      radial-gradient(circle at 6px 4px, var(--marigold) 3.2px, transparent 3.6px),
      radial-gradient(circle at 18px 4px, var(--lotus) 3.2px, transparent 3.6px),
      radial-gradient(circle at 30px 4px, var(--jade) 2.4px, transparent 2.8px);
    background-size: 36px 8px; background-repeat: repeat-x; background-position: 0 100%;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-family: "Mitr", sans-serif; font-weight: 500; font-size: 1.15rem; color: var(--ink); }
  .brand img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 2px var(--marigold-soft); }
  .brand .thai { color: var(--lotus); font-size: 0.95rem; display: block; line-height: 1; }
  .brand-text { line-height: 1.05; }
  #topbar .spacer { flex: 1; }
  .profiles { display: flex; padding: 4px; border-radius: 999px; background: var(--card-sunken); }
  .profile-btn {
    font-family: "Mitr", sans-serif; font-weight: 500; font-size: 0.9rem; padding: 6px 16px; border-radius: 999px;
    border: none; background: transparent; color: var(--ink-soft); cursor: pointer;
  }
  .profile-btn[aria-pressed="true"] { background: var(--card); color: var(--jade); box-shadow: 0 2px 6px hsl(var(--shadow) / 0.15); }
  .stat-pill {
    display: flex; align-items: center; gap: 6px; font-family: "Mitr", sans-serif; font-weight: 500; font-size: 0.95rem;
    padding: 6px 12px; border-radius: 999px; font-variant-numeric: tabular-nums;
  }
  .stat-pill.streak { color: var(--clay); background: var(--clay-soft); }
  .stat-pill.xp { color: var(--marigold-deep); background: var(--marigold-soft); }

  .wrap { max-width: 760px; margin: 0 auto; padding: 26px 20px 60px; }

  /* ---------- Home: next-lesson hero ---------- */
  .hero {
    display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center;
    background: var(--card); border-radius: 28px; padding: 22px 26px 24px; margin-bottom: 34px;
    box-shadow: 0 1px 0 var(--line), 0 18px 40px -24px hsl(var(--shadow) / 0.35);
  }
  .hero-mascot { position: relative; width: 148px; }
  .hero-mascot img { width: 148px; height: 148px; border-radius: 50%; object-fit: cover; background: #f6efe0;
    box-shadow: 0 0 0 6px var(--marigold-soft); animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  .bubble {
    position: absolute; top: -10px; left: -12px; background: var(--lotus); color: #fff; border-radius: 14px 14px 14px 4px;
    padding: 4px 10px; font-size: 1rem; box-shadow: 0 4px 0 color-mix(in srgb, var(--lotus) 70%, #000);
    border-radius: 14px 14px 4px 14px; transform: rotate(-6deg);
  }
  .hero-eyebrow { font-size: 0.85rem; font-weight: 600; color: var(--jade); letter-spacing: 0.06em; text-transform: uppercase; }
  .hero h1 { font-size: clamp(1.6rem, 4.5vw, 2.1rem); line-height: 1.15; margin: 4px 0 4px; }
  .hero-sub { color: var(--ink-soft); margin: 0 0 16px; }
  .hero-actions { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .level-meter { flex: 1; min-width: 160px; }
  .level-meter .label { font-size: 0.85rem; color: var(--ink-soft); display: flex; justify-content: space-between; margin-bottom: 5px; }
  .meter-track { height: 10px; border-radius: 999px; background: var(--card-sunken); overflow: hidden; }
  .meter-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--jade), var(--leaf)); }

  /* ---------- Home: levels and unit cards ---------- */
  .level { margin-bottom: 30px; }
  .level-head { display: flex; align-items: baseline; gap: 12px; margin: 0 4px 14px; }
  .level-head h2 { font-size: 1.35rem; }
  .level-head .count { color: var(--ink-faint); font-size: 0.95rem; }
  details.level > summary { list-style: none; cursor: pointer; }
  details.level > summary::-webkit-details-marker { display: none; }
  details.level > summary .level-head { padding: 14px 18px; margin: 0; border-radius: 18px; background: var(--card-sunken); }
  details.level > summary .level-head::after { content: "Show units ▾"; margin-left: auto; font-size: 0.85rem; color: var(--ink-soft); }
  details.level[open] > summary .level-head::after { content: "Hide ▴"; }
  details.level[open] > summary { margin-bottom: 14px; }

  .units { display: grid; gap: 16px; }
  .unit {
    --u: var(--jade); --u-soft: var(--jade-soft);
    background: var(--card); border-radius: 24px; overflow: hidden;
    box-shadow: 0 1px 0 var(--line), 0 14px 30px -24px hsl(var(--shadow) / 0.4);
  }
  .unit.c1 { --u: var(--marigold-deep); --u-soft: var(--marigold-soft); }
  .unit.c2 { --u: var(--lotus); --u-soft: var(--lotus-soft); }
  .unit.c3 { --u: var(--sky); --u-soft: color-mix(in srgb, var(--sky) 16%, var(--card)); }
  .unit.c4 { --u: var(--leaf); --u-soft: color-mix(in srgb, var(--leaf) 16%, var(--card)); }
  .unit-banner { position: relative; height: 128px; background: var(--u-soft); overflow: hidden; }
  .unit-banner img { width: 100%; height: 100%; object-fit: cover; }
  /* signature: until the illustration exists, the unit's own first Thai word fills the banner */
  .unit-banner .watermark {
    position: absolute; right: -6px; bottom: -22px; font-family: "Mitr", sans-serif; font-weight: 600;
    font-size: 6.2rem; line-height: 1; color: var(--u); opacity: 0.2; white-space: nowrap; pointer-events: none;
  }
  .unit-banner .unit-no {
    position: absolute; left: 20px; top: 16px; font-family: "Mitr", sans-serif; font-weight: 500; font-size: 0.85rem;
    background: var(--card); color: var(--u); padding: 3px 12px; border-radius: 999px;
  }
  .unit-banner .unit-done { position: absolute; right: 16px; top: 14px; background: var(--u); color: #fff; border-radius: 999px; padding: 3px 12px; font-size: 0.85rem; font-weight: 600; }
  .unit-body { padding: 16px 22px 20px; }
  .unit-body h3 { font-size: 1.3rem; }
  .unit-body .tagline { color: var(--ink-soft); margin: 2px 0 14px; font-size: 0.98rem; }
  .stones { display: flex; flex-wrap: wrap; gap: 8px 4px; align-items: flex-start; }
  .stones:has(.current) { padding-top: 26px; }
  .unit.complete .unit-banner { height: 76px; }
  .unit.complete .unit-banner .watermark { font-size: 4.4rem; bottom: -14px; }
  .stone { display: flex; flex-direction: column; align-items: center; width: 108px; position: relative; }
  .stone:not(:last-child)::after {
    content: ""; position: absolute; top: 31px; left: calc(50% + 36px); width: calc(100% - 72px + 4px); border-top: 3px dotted var(--line);
  }
  .node-btn {
    width: 66px; height: 62px; border-radius: 50% / 46%; border: none; cursor: pointer; position: relative;
    display: flex; align-items: center; justify-content: center; font-family: "Mitr", sans-serif; font-weight: 500; font-size: 1.3rem;
    background: var(--card-sunken); color: var(--ink-faint); box-shadow: 0 5px 0 var(--line);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .node-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
  .node-btn.unlocked { background: var(--u-soft); color: var(--u); box-shadow: 0 5px 0 color-mix(in srgb, var(--u) 45%, var(--card)); }
  .node-btn.current { background: var(--marigold); color: #3a2400; box-shadow: 0 5px 0 var(--marigold-deep); }
  .node-btn.current::before {
    content: "Start"; position: absolute; top: -30px; left: 50%; transform: translateX(-50%);
    font-size: 0.8rem; background: var(--card); color: var(--marigold-deep); padding: 2px 10px; border-radius: 10px;
    box-shadow: 0 2px 0 var(--line), 0 0 0 2px var(--marigold-soft); animation: nudge 1.6s ease-in-out infinite;
  }
  @keyframes nudge { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, -4px); } }
  .node-btn.done { background: var(--u); color: #fff; box-shadow: 0 5px 0 color-mix(in srgb, var(--u) 70%, #000); }
  .node-btn:disabled { cursor: not-allowed; }
  .node-stars { font-size: 0.8rem; letter-spacing: 1px; color: var(--marigold); height: 16px; margin-top: 8px; }
  .node-label { font-size: 0.85rem; color: var(--ink-soft); text-align: center; line-height: 1.2; }
  .unit.locked .unit-banner { filter: grayscale(0.85); opacity: 0.7; height: 70px; }
  .unit.locked .unit-banner .watermark { font-size: 4rem; bottom: -14px; }
  .unit.locked .unit-body { padding-bottom: 16px; }
  .unit.locked .tagline { margin-bottom: 0; }
  .unit.locked h3 { color: var(--ink-soft); }
  .unit-lock-note { font-size: 0.9rem; color: var(--ink-faint); margin-top: 6px; }

  /* ---------- Lesson runner ---------- */
  #lesson-view { max-width: 620px; margin: 0 auto; padding: 20px 20px 170px; }
  .lesson-topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
  .exit-btn { background: none; border: none; color: var(--ink-faint); font-size: 1.5rem; cursor: pointer; line-height: 1; padding: 6px; border-radius: 10px; }
  .exit-btn:hover { color: var(--ink); }
  .progress-track { flex: 1; height: 16px; border-radius: 999px; background: var(--card-sunken); overflow: hidden; }
  .progress-fill {
    height: 100%; border-radius: 999px; transition: width 0.4s cubic-bezier(.3,1.4,.6,1);
    background: linear-gradient(var(--jade), var(--jade)); position: relative; min-width: 16px;
  }
  .progress-fill::after { content: ""; position: absolute; left: 8px; right: 8px; top: 4px; height: 4px; border-radius: 4px; background: rgba(255,255,255,0.35); }
  .hearts-live { display: flex; gap: 2px; font-size: 1.15rem; color: var(--lotus); }
  .hearts-live span.spent { opacity: 0.2; filter: grayscale(1); }

  .exercise-card { background: var(--card); border-radius: 28px; padding: 26px 24px 24px; box-shadow: 0 1px 0 var(--line), 0 18px 40px -26px hsl(var(--shadow) / 0.35); }
  .exercise-prompt { text-align: center; margin-bottom: 22px; }
  .exercise-kicker { font-family: "Mitr", sans-serif; font-weight: 400; font-size: 1.05rem; color: var(--ink-soft); margin-bottom: 12px; }
  .prompt-word { font-size: clamp(2.6rem, 11vw, 3.6rem); line-height: 1.25; color: var(--ink); font-weight: 500; }
  .prompt-word.mystery { color: var(--ink-faint); letter-spacing: 0.2em; }
  .prompt-en { font-family: "Mitr", sans-serif; font-size: clamp(1.8rem, 7vw, 2.3rem); line-height: 1.2; }
  .prompt-roman { color: var(--ink-soft); font-size: 1.15rem; margin-top: 2px; }
  .speak-row { margin-top: 14px; display: flex; justify-content: center; gap: 12px; }
  .speak-btn {
    width: 58px; height: 58px; border-radius: 50%; border: none; cursor: pointer; font-size: 1.5rem;
    background: var(--jade); color: #fff; box-shadow: 0 4px 0 var(--jade-deep); display: grid; place-items: center;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .speak-btn[data-speak="slow"] { width: 46px; height: 46px; font-size: 1.2rem; margin-top: 6px; background: var(--jade-soft); color: var(--jade-deep); box-shadow: 0 4px 0 color-mix(in srgb, var(--jade) 40%, var(--card)); }
  .speak-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--jade-deep); }
  .speak-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .option-grid { display: grid; gap: 12px; }
  .option-btn {
    display: flex; align-items: center; gap: 14px; width: 100%;
    font: inherit; font-size: 1.1rem; text-align: left; padding: 14px 16px; cursor: pointer;
    border-radius: 16px; border: 2px solid var(--line); background: var(--card); box-shadow: 0 4px 0 var(--line);
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s, border-color 0.15s;
  }
  .option-btn .key {
    flex: none; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    border: 2px solid var(--line); color: var(--ink-faint); font-size: 0.85rem; font-weight: 700;
  }
  .option-btn .roman { color: var(--ink-soft); font-size: 0.95rem; margin-left: 6px; }
  .option-btn:hover:not(:disabled):not(.selected) { background: color-mix(in srgb, var(--jade) 5%, var(--card)); }
  .option-btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .option-btn.selected { border-color: var(--marigold); background: var(--marigold-soft); box-shadow: 0 4px 0 var(--marigold); }
  .option-btn.selected .key { border-color: var(--marigold); color: var(--marigold-deep); }
  .option-btn.correct { border-color: var(--jade); background: var(--jade-soft); box-shadow: 0 4px 0 var(--jade); }
  .option-btn.correct .key { border-color: var(--jade); background: var(--jade); color: #fff; }
  .option-btn.wrong { border-color: var(--clay); background: var(--clay-soft); box-shadow: 0 4px 0 var(--clay); }
  .option-btn.wrong .key { border-color: var(--clay); background: var(--clay); color: #fff; }
  .option-btn:disabled { cursor: default; }
  .option-btn:disabled:not(.correct):not(.wrong) { opacity: 0.55; }

  .type-row { display: flex; gap: 10px; margin-top: 6px; }
  #type-input {
    flex: 1; font: inherit; font-size: 1.2rem; padding: 15px 18px; border-radius: 16px;
    border: 2px solid var(--line); background: var(--card-sunken); color: var(--ink);
  }
  #type-input:focus { outline: none; border-color: var(--marigold); background: var(--card); }
  #type-input.correct { border-color: var(--jade); background: var(--jade-soft); }
  #type-input.wrong { border-color: var(--clay); background: var(--clay-soft); }

  .check-btn { display: block; width: 100%; margin-top: 24px; }

  /* answer feedback slides up from the bottom like a sheet */
  .feedback-banner {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; padding: 20px max(20px, calc(50% - 290px)) 28px;
    font-family: "Mitr", sans-serif; font-weight: 500; font-size: 1.35rem; text-align: left;
    animation: sheet-up 0.25s cubic-bezier(.2,1.2,.4,1);
  }
  @keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .feedback-banner.good { background: var(--jade-soft); color: var(--jade-deep); box-shadow: 0 -2px 0 color-mix(in srgb, var(--jade) 35%, transparent); }
  .feedback-banner.bad { background: var(--clay-soft); color: var(--clay); box-shadow: 0 -2px 0 color-mix(in srgb, var(--clay) 35%, transparent); }
  .feedback-answer { display: block; font-family: "Sarabun", sans-serif; font-weight: 500; margin-top: 4px; font-size: 1.05rem; color: var(--ink); }
  .feedback-answer .thai { font-size: 1.2rem; }

  /* match round */
  .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .match-tile {
    font: inherit; font-size: 1.05rem; padding: 14px 10px; border-radius: 16px; border: 2px solid var(--line);
    background: var(--card); box-shadow: 0 4px 0 var(--line); cursor: pointer; text-align: center; min-height: 58px;
    transition: transform 0.08s ease, box-shadow 0.08s ease, opacity 0.3s;
  }
  .match-tile.thai { font-size: 1.3rem; }
  .match-tile:active:not(.solved) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .match-tile.selected { border-color: var(--marigold); background: var(--marigold-soft); box-shadow: 0 4px 0 var(--marigold); }
  .match-tile.solved { border-color: var(--jade); background: var(--jade-soft); box-shadow: none; opacity: 0.45; cursor: default; transform: scale(0.97); }
  .match-tile.shake { animation: shake 0.35s; border-color: var(--clay); }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  /* ---------- Summary screen ---------- */
  #summary-view { max-width: 480px; margin: 40px auto; text-align: center; padding: 0 20px; }
  .summary-card { background: var(--card); border-radius: 28px; padding: 30px 26px 28px; box-shadow: 0 1px 0 var(--line), 0 18px 40px -26px hsl(var(--shadow) / 0.35); }
  .summary-mascot { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; margin: 0 auto 16px; background: #f6efe0; box-shadow: 0 0 0 6px var(--marigold-soft); animation: hop 0.9s cubic-bezier(.3,1.6,.5,1) 2; }
  .summary-mascot.sad { box-shadow: 0 0 0 6px var(--lotus-soft); animation: none; filter: saturate(0.8); }
  @keyframes hop { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-16px); } }
  #summary-view h2 { font-size: 2rem; }

  .stars-big span.on { color: var(--marigold); animation: star-pop 0.45s cubic-bezier(.3,1.8,.5,1) backwards; }
  .stars-big span.on:nth-child(2) { animation-delay: 0.18s; } .stars-big span.on:nth-child(3) { animation-delay: 0.36s; }

  .summary-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  .confetti-piece {
    position: fixed; top: -12px; width: 9px; height: 14px; border-radius: 2px; z-index: 50; pointer-events: none;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: 0.9; } }

  footer.page { text-align: center; color: var(--ink-faint); font-size: 0.85rem; padding: 10px 20px 40px; }

  @media (max-width: 560px) {
    body { font-size: 16px; }
    #topbar { padding: 8px 14px 16px; gap: 8px; }
    .brand-text { display: none; }
    .stat-pill { padding: 5px 10px; font-size: 0.9rem; }
    .hero { grid-template-columns: 1fr; text-align: center; padding: 22px 20px; justify-items: center; }
    .hero-mascot, .hero-mascot img { width: 116px; height: 116px; }

    .unit-body { padding: 14px 16px 18px; }
    .exercise-card { padding: 22px 16px 20px; border-radius: 24px; }
    .match-grid { gap: 10px; }
  }

          w("กรุณา", "kà-rú-naa", "Please (formal register)", T.mid),

      lessons: [

          w("ดวงใจ", "duang-jai", "Beloved / darling (lit. \"heart orb\")", T.mid),
          w("รอคอย", "rɔɔ-khɔɔi", "To wait longingly", T.mid),
          w("คิดถึง", "khít-thʉ̌ng", "To miss (someone)", T.rising),
          w("ลาก่อน", "laa kɔ̀ɔn", "Farewell (poetic goodbye)", T.low),
          w("ความทรงจำ", "khwaam-song-jam", "Memory", T.mid)
        ]}

  ];

  GROUPS.forEach(function (g) {
    g.lessons.forEach(function (l) {
      l.words.forEach(function (word, i) { word.audioId = l.id + "-" + i; });
    });
  });

  var TONE_LABEL = { mid: "mid tone", low: "low tone", falling: "falling tone", high: "high tone", rising: "rising tone" };

  /* difficulty tiers by group index: 1=recognition only, 2=+listening/matching, 3=+typing, 4=+listen-and-type */
  function tierFor(groupIndex) {
    if (groupIndex <= 3) return 1;
    if (groupIndex <= 7) return 2;
    if (groupIndex <= 13) return 3;
    return 4;
  }

  /* =========================================================
     STATE / PERSISTENCE
  ========================================================= */
  var state = { profile: "dad", view: "dashboard", session: null };

  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function storeKey(profile) { return "sawasdee-thai-progress-" + profile; }

  function defaultProgress() { return { xp: 0, streak: 0, lastPlayed: null, stars: {} }; }

  function loadProgress(profile) {
    try {
      var raw = localStorage.getItem(storeKey(profile));
      if (!raw) return defaultProgress();
      var p = JSON.parse(raw);
      return { xp: p.xp || 0, streak: p.streak || 0, lastPlayed: p.lastPlayed || null, stars: p.stars || {} };
    } catch (e) { return defaultProgress(); }
  }
  function saveProgress(profile, p) {
    try { localStorage.setItem(storeKey(profile), JSON.stringify(p)); } catch (e) {}
  }
  function progress() { return loadProgress(state.profile); }

  function bumpStreak(p) {
    var today = todayStr();
    if (p.lastPlayed === today) return p;
    var yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
    p.streak = p.lastPlayed === yesterday ? p.streak + 1 : 1;
    p.lastPlayed = today;
    return p;
  }

  function starsFor(p, lessonId) { return p.stars[lessonId] || 0; }

  function lessonUnlocked(p, groupIndex, lessonIndex) {
    if (groupIndex === 0 && lessonIndex === 0) return true;
    if (lessonIndex > 0) {
      var prevLesson = GROUPS[groupIndex].lessons[lessonIndex - 1];
      return starsFor(p, prevLesson.id) > 0;
    }
    var prevGroup = GROUPS[groupIndex - 1];
    return prevGroup.lessons.every(function (l) { return starsFor(p, l.id) > 0; });
  }
  function groupUnlocked(p, groupIndex) {
    if (groupIndex === 0) return true;
    var prevGroup = GROUPS[groupIndex - 1];
    return prevGroup.lessons.every(function (l) { return starsFor(p, l.id) > 0; });
  }

  /* =========================================================
     VOICES
  ========================================================= */
  var thaiVoice = null, englishVoice = null;
  var speechSupported = "speechSynthesis" in window;
  function findVoices() {
    if (!speechSupported) return;
    var voices = speechSynthesis.getVoices();
    thaiVoice = null; englishVoice = null;
    for (var i = 0; i < voices.length; i++) {
      var lang = (voices[i].lang || "").toLowerCase();
      if (!thaiVoice && lang.indexOf("th") === 0) thaiVoice = voices[i];
      if (!englishVoice && lang.indexOf("en") === 0) englishVoice = voices[i];
    }
  }
  if (speechSupported) { findVoices(); speechSynthesis.onvoiceschanged = findVoices; }

  function say(text, voice) {
    if (!voice) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.voice = voice; u.lang = voice.lang; u.rate = 0.85;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  /* recorded clips live in audio/{lessonId}-{wordIndex}.mp3; fall back to the browser voice if one is missing */
  var clip = new Audio();
  function playThai(word, slow) {
    try { speechSynthesis.cancel(); } catch (e) {}
    clip.pause();
    clip.onerror = function () { say(word.thai, thaiVoice); };
    clip.src = "audio/" + word.audioId + ".mp3";
    clip.playbackRate = slow ? 0.7 : 1;
    var p = clip.play();
    if (p && p.catch) p.catch(function () {});
  }
  function speakButtonsHtml() {
    return '<div class="speak-row"><button type="button" class="speak-btn" data-speak="normal" aria-label="Play" title="Play">🔊</button>' +
      '<button type="button" class="speak-btn" data-speak="slow" aria-label="Play slowly" title="Play slowly">🐢</button></div>';
  }
  function wireSpeakButtons(root, word) {
    root.querySelectorAll("[data-speak]").forEach(function (btn) {
      btn.addEventListener("click", function () { playThai(word, btn.dataset.speak === "slow"); });
    });
  }

  /* tiny WebAudio beep for feedback */
  var actx = null;
  function beep(good) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine";
      o.frequency.value = good ? 880 : 220;
      g.gain.value = 0.06;
      o.connect(g); g.connect(actx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.28);
      o.stop(actx.currentTime + 0.3);
    } catch (e) {}
  }

  /* =========================================================
     HELPERS
  ========================================================= */
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function normalize(s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }

  /* pool of all words introduced up to & including a given group/lesson, for distractors */
  function poolUpTo(groupIndex, lessonIndex) {
    var pool = [];
    for (var g = 0; g <= groupIndex; g++) {
      var lessons = GROUPS[g].lessons;
      var lastL = g === groupIndex ? lessonIndex : lessons.length - 1;
      for (var l = 0; l <= lastL; l++) pool = pool.concat(lessons[l].words);
    }
    return pool;
  }
  function distractorsFor(lessonWords, widerPool, correct, count) {
    var sameLesson = lessonWords.filter(function (x) { return x.en !== correct.en; });
    var candidates = sameLesson.length >= count ? sameLesson : widerPool.filter(function (x) { return x.en !== correct.en; });
    return shuffle(candidates).slice(0, Math.min(count, candidates.length));
  }

  /* =========================================================
     EXERCISE QUEUE BUILDER
  ========================================================= */
  function buildQueue(groupIndex, lessonIndex) {
    var lesson = GROUPS[groupIndex].lessons[lessonIndex];
    var tier = tierFor(groupIndex);
    var pool = poolUpTo(groupIndex, lessonIndex);
    var optCount = tier === 1 ? 3 : 4;
    var queue = [];

    lesson.words.forEach(function (word) {
      queue.push({ type: "mc-en", word: word, options: shuffle([word].concat(distractorsFor(lesson.words, pool, word, optCount - 1))) });
      queue.push({ type: "mc-th", word: word, options: shuffle([word].concat(distractorsFor(lesson.words, pool, word, optCount - 1))) });
    });

    if (tier >= 2) {
      shuffle(lesson.words).slice(0, Math.min(2, lesson.words.length)).forEach(function (word) {
        queue.push({ type: "listen", word: word, options: shuffle([word].concat(distractorsFor(lesson.words, pool, word, optCount - 1))) });
      });
    }
    if (tier >= 3) {
      shuffle(lesson.words).slice(0, Math.min(2, lesson.words.length)).forEach(function (word) {
        queue.push({ type: "type-en", word: word });
      });
    }
    if (tier >= 4) {
      shuffle(lesson.words).slice(0, Math.min(2, lesson.words.length)).forEach(function (word) {
        queue.push({ type: "listen-type", word: word });
      });
    }

    queue = shuffle(queue);
    if (lesson.words.length >= 3) queue.push({ type: "match", words: lesson.words });
    return queue;
  }

  /* =========================================================
     RENDER: DASHBOARD
  ========================================================= */
  var dashboardEl = document.getElementById("dashboard-view");

  function updateStatPills() {
    var p = progress();
    document.getElementById("stat-streak").textContent = "🔥 " + p.streak;
    document.getElementById("stat-xp").textContent = "✦ " + p.xp + " XP";
  }

  /* course levels, by unit index (matches data/curriculum.json) */
  var LEVELS = [
    { name: "Beginner", from: 0, to: 13 },
    { name: "Elementary", from: 14, to: 19 },
    { name: "Intermediate", from: 20, to: 25 },
    { name: "Upper-Intermediate", from: 26, to: 31 },
    { name: "Advanced", from: 32, to: 36 },
    { name: "Fluency & Mastery", from: 37, to: 42 }
  ];

  function nextLesson(p) {
    for (var gi = 0; gi < GROUPS.length; gi++) {
      for (var li = 0; li < GROUPS[gi].lessons.length; li++) {
        if (starsFor(p, GROUPS[gi].lessons[li].id) === 0 && groupUnlocked(p, gi) && lessonUnlocked(p, gi, li)) return { gi: gi, li: li };
      }
    }
    return null;
  }

  function renderHero(p, next) {
    var who = state.profile === "son" ? "Son" : "Dad";
    var html = '<section class="hero"><div class="hero-mascot"><img src="art/mascot.png" alt="Nong Chang the baby elephant" width="148" height="148" />' +
      '<span class="bubble thai">สวัสดี!</span></div><div>';
    if (!next) {
      html += '<div class="hero-eyebrow">Course complete</div><h1>You finished every lesson, ' + who + '!</h1>' +
        '<p class="hero-sub">Replay any lesson below to earn more stars.</p></div></section>';
      return html;
    }
    var g = GROUPS[next.gi], lesson = g.lessons[next.li];
    var level = LEVELS.filter(function (l) { return next.gi >= l.from && next.gi <= l.to; })[0];
    var total = 0, done = 0;
    for (var gi = level.from; gi <= level.to; gi++) GROUPS[gi].lessons.forEach(function (l) { total++; if (starsFor(p, l.id) > 0) done++; });
    html += '<div class="hero-eyebrow">Next up · Unit ' + (next.gi + 1) + ' · ' + escapeHtml(g.title) + '</div>' +
      '<h1>' + escapeHtml(lesson.title) + '</h1>' +
      '<p class="hero-sub">' + lesson.words.length + ' new words' + (p.xp === 0 ? ', ' + who + '. Turn the sound up!' : ' for ' + who + '.') + '</p>' +
      '<div class="hero-actions"><button type="button" class="chunky gold" id="hero-start">Start lesson</button>' +
      '<div class="level-meter"><div class="label"><span>' + level.name + '</span><span>' + done + ' / ' + total + ' lessons</span></div>' +
      '<div class="meter-track"><div class="meter-fill" style="width:' + Math.round(100 * done / total) + '%"></div></div></div></div></div></section>';
    return html;
  }

  function renderUnit(p, group, gi, next) {
    var unlocked = groupUnlocked(p, gi);
    var doneCount = group.lessons.filter(function (l) { return starsFor(p, l.id) > 0; }).length;
    var html = '<article class="unit c' + (gi % 5) + (unlocked ? "" : " locked") + (doneCount === group.lessons.length ? " complete" : "") + '">';
    html += '<div class="unit-banner"><img src="art/units/' + group.id + '.webp" alt="" loading="lazy" onerror="this.remove()" />';
    html += '<span class="watermark thai" aria-hidden="true">' + group.lessons[0].words[0].thai + '</span>';
    html += '<span class="unit-no">Unit ' + (gi + 1) + '</span>';
    if (doneCount === group.lessons.length) html += '<span class="unit-done">Done ✓</span>';
    html += '</div><div class="unit-body"><h3>' + escapeHtml(group.title) + '</h3><p class="tagline">' + escapeHtml(group.tagline) + '</p>';
    if (!unlocked) {
      if (gi > 0 && groupUnlocked(p, gi - 1)) html += '<div class="unit-lock-note">🔒 Finish “' + escapeHtml(GROUPS[gi - 1].title) + '” to open this unit</div>';
      return html + '</div></article>';
    }
    html += '<div class="stones">';
    group.lessons.forEach(function (lesson, li) {
      var lUnlocked = lessonUnlocked(p, gi, li);
      var stars = starsFor(p, lesson.id);
      var isNext = next && next.gi === gi && next.li === li;
      var cls = "node-btn " + (stars > 0 ? "done" : isNext ? "current" : lUnlocked ? "unlocked" : "locked");
      html += '<div class="stone"><button type="button" class="' + cls + '" data-group="' + gi + '" data-lesson="' + li + '" ' +
        (lUnlocked ? "" : "disabled ") + 'aria-label="Lesson ' + (li + 1) + ': ' + escapeHtml(lesson.title) + (stars ? ", " + stars + " stars" : "") + '">' +
        (stars > 0 ? "✓" : lUnlocked ? (li + 1) : "🔒") + '</button>';
      html += '<div class="node-stars" aria-hidden="true">' + (stars > 0 ? "★".repeat(stars) + "☆".repeat(3 - stars) : "") + '</div>';
      html += '<div class="node-label">' + escapeHtml(lesson.title) + '</div></div>';
    });
    return html + '</div></div></article>';
  }

  function renderDashboard() {
    var p = progress();
    updateStatPills();
    var next = nextLesson(p);
    var html = renderHero(p, next);
    LEVELS.forEach(function (level, idx) {
      var total = 0, done = 0;
      for (var gi = level.from; gi <= level.to; gi++) GROUPS[gi].lessons.forEach(function (l) { total++; if (starsFor(p, l.id) > 0) done++; });
      var current = next ? (next.gi >= level.from && next.gi <= level.to) : idx === 0;
      var head = '<div class="level-head"><h2>' + level.name + '</h2><span class="count">' +
        (done === total ? "All " + total + " lessons done ✓" : done + " / " + total + " lessons") + '</span></div>';
      html += '<details class="level"' + (current ? " open" : "") + '><summary>' + head + '</summary><div class="units">';
      for (var g = level.from; g <= level.to; g++) html += renderUnit(p, GROUPS[g], g, next);
      html += '</div></details>';
    });
    dashboardEl.innerHTML = html;

    dashboardEl.querySelectorAll(".node-btn:not([disabled])").forEach(function (btn) {
      btn.addEventListener("click", function () {
        startLesson(parseInt(btn.dataset.group, 10), parseInt(btn.dataset.lesson, 10));
      });
    });
    var heroStart = document.getElementById("hero-start");
    if (heroStart) heroStart.addEventListener("click", function () { startLesson(next.gi, next.li); });
  }

  /* =========================================================
     LESSON RUNNER
  ========================================================= */
  var lessonEl = document.getElementById("lesson-view");
  var summaryEl = document.getElementById("summary-view");

  function startLesson(groupIndex, lessonIndex) {
    state.session = {
      groupIndex: groupIndex, lessonIndex: lessonIndex,
      queue: buildQueue(groupIndex, lessonIndex),
      pos: 0, hearts: 5, mistakes: 0, xp: 0, selected: null
    };
    showView("lesson");
    renderExercise();
  }

  function showView(v) {
    state.view = v;
    dashboardEl.hidden = v !== "dashboard";
    lessonEl.hidden = v !== "lesson";
    summaryEl.hidden = v !== "summary";
    window.scrollTo(0, 0);
  }

  function heartsHtml(session) {
    var h = "";
    for (var i = 0; i < 5; i++) h += '<span class="' + (i < session.hearts ? "" : "spent") + '">❤</span>';
    return h;
  }

  function renderExercise() {
    var s = state.session;
    if (s.pos >= s.queue.length) { finishLesson(); return; }
    var ex = s.queue[s.pos];
    var pct = Math.round((s.pos / s.queue.length) * 100);

    var html = '<div class="lesson-topbar">';
    html += '<button class="exit-btn" id="exit-lesson" aria-label="Exit lesson">✕</button>';
    html += '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
    html += '<div class="hearts-live">' + heartsHtml(s) + "</div></div>";

    html += '<div class="exercise-card">' + (ex.type === "match" ? renderMatchHtml() : renderQuestionHtml(ex)) + '</div>';

    lessonEl.innerHTML = html;
    document.getElementById("exit-lesson").addEventListener("click", function () { showView("dashboard"); renderDashboard(); });

    if (ex.type === "match") wireMatch(ex);
    else wireQuestion(ex);
  }

  function renderQuestionHtml(ex) {
    var html = '<div class="exercise-prompt">';
    if (ex.type === "mc-en") {
      html += '<div class="exercise-kicker">Choose the English meaning</div>';
      html += '<div class="prompt-word thai">' + ex.word.thai + "</div>";
      html += '<div class="prompt-roman">' + escapeHtml(ex.word.roman) + "</div>";
      html += speakButtonsHtml();
    } else if (ex.type === "mc-th") {
      html += '<div class="exercise-kicker">Choose the Thai word</div>';
      html += '<div class="prompt-en">' + escapeHtml(ex.word.en) + "</div>";
    } else if (ex.type === "listen") {
      html += '<div class="exercise-kicker">Listen, then choose what it means</div>';
      html += '<div class="prompt-word mystery" aria-hidden="true">· · ·</div>';
      html += speakButtonsHtml();
    } else if (ex.type === "type-en") {
      html += '<div class="exercise-kicker">Type the English meaning</div>';
      html += '<div class="prompt-word thai">' + ex.word.thai + "</div>";
      html += '<div class="prompt-roman">' + escapeHtml(ex.word.roman) + "</div>";
      html += speakButtonsHtml();
    } else if (ex.type === "listen-type") {
      html += '<div class="exercise-kicker">Listen, then type what it means</div>';
      html += '<div class="prompt-word mystery" aria-hidden="true">· · ·</div>';
      html += speakButtonsHtml();
    }
    html += "</div>";

    if (ex.type === "type-en" || ex.type === "listen-type") {
      html += '<div class="type-row"><input id="type-input" type="text" autocomplete="off" placeholder="Type your answer…" /></div>';
    } else {
      html += '<div class="option-grid" id="option-grid">';
      ex.options.forEach(function (opt, i) {
        var label = ex.type === "mc-th" ?
          '<span><span class="thai">' + opt.thai + '</span><span class="roman">' + escapeHtml(opt.roman) + "</span></span>" :
          "<span>" + escapeHtml(opt.en) + "</span>";
        html += '<button type="button" class="option-btn" data-i="' + i + '"><span class="key" aria-hidden="true">' + (i + 1) + "</span>" + label + "</button>";
      });
      html += "</div>";
    }

    html += '<button type="button" class="chunky check-btn" id="check-btn" disabled>Check</button>';
    html += '<div id="feedback-slot"></div>';
    return html;
  }

  function wireQuestion(ex) {
    var s = state.session;
    var checkBtn = document.getElementById("check-btn");
    var chosen = null;

    if (ex.type !== "mc-th") {
      wireSpeakButtons(lessonEl, ex.word);
      setTimeout(function () { playThai(ex.word); }, 250);
    }

    if (ex.type === "type-en" || ex.type === "listen-type") {
      var input = document.getElementById("type-input");
      input.addEventListener("input", function () {
        checkBtn.disabled = input.value.trim().length === 0;
        checkBtn.classList.toggle("ready", !checkBtn.disabled);
      });
      input.addEventListener("keydown", function (e) { if (e.key === "Enter" && !checkBtn.disabled) checkBtn.click(); });
      input.focus();
    } else {
      var buttons = Array.prototype.slice.call(document.querySelectorAll(".option-btn"));
      buttons.forEach(function (btn, i) {
        btn.addEventListener("click", function () {
          buttons.forEach(function (b) { b.classList.remove("selected"); });
          chosen = ex.options[i];
          btn.classList.add("selected");
          checkBtn.disabled = false;
          checkBtn.classList.add("ready");
        });
      });
    }

    checkBtn.addEventListener("click", function () {
      if (checkBtn.disabled) return;
      var isCorrect;
      if (ex.type === "type-en" || ex.type === "listen-type") {
        var val = normalize(document.getElementById("type-input").value);
        var accepted = (ex.word.accept || []).map(normalize).concat([normalize(ex.word.en)]);
        isCorrect = accepted.indexOf(val) !== -1;
        var inputEl = document.getElementById("type-input");
        inputEl.classList.add(isCorrect ? "correct" : "wrong");
        inputEl.disabled = true;
      } else {
        isCorrect = chosen === ex.word;
        var opts = document.querySelectorAll(".option-btn");
        opts.forEach(function (b, i) {
          b.disabled = true;
          b.classList.remove("selected");
          if (ex.options[i] === ex.word) b.classList.add("correct");
          else if (ex.options[i] === chosen) b.classList.add("wrong");
        });
      }
      settleAnswer(isCorrect, ex);
      checkBtn.disabled = true;
      checkBtn.classList.remove("ready");
    });
  }

  function settleAnswer(isCorrect, ex) {
    var s = state.session;
    beep(isCorrect);
    var fb = document.getElementById("feedback-slot");
    if (isCorrect) {
      s.xp += 10;
      fb.innerHTML = '<div class="feedback-banner good" role="status">' + ["Nice!", "เก่งมาก! Great!", "Correct!", "Spot on!"][Math.floor(Math.random() * 4)] + '</div>';
    } else {
      s.hearts -= 1;
      s.mistakes += 1;
      var answerWord = ex.word;
      fb.innerHTML = '<div class="feedback-banner bad" role="status">Not quite<span class="feedback-answer">' +
        escapeHtml(answerWord.en) + " — " + '<span class="thai">' + answerWord.thai + "</span> (" + escapeHtml(answerWord.roman) + ")</span></div>";
    }
    var hearIt = !isCorrect || ex.type === "mc-th";
    if (hearIt) playThai(ex.word);
    setTimeout(function () {
      if (s.hearts <= 0) { failLesson(); return; }
      s.pos += 1;
      renderExercise();
    }, isCorrect ? (hearIt ? 1600 : 700) : 2800);
  }

  /* ---- match round ---- */
  function renderMatchHtml() {
    return '<div class="exercise-prompt"><div class="exercise-kicker">Match the pairs</div></div>' +
      '<div class="match-grid" id="match-grid"></div>' +
      '<div class="feedback-banner good" id="match-done" role="status" hidden>All matched!</div>';
  }

  function wireMatch(ex) {
    var s = state.session;
    var thaiTiles = shuffle(ex.words.map(function (word) { return { key: word.en, label: word.thai, cls: "thai", word: word }; }));
    var enTiles = shuffle(ex.words.map(function (word) { return { key: word.en, label: word.en, cls: "", word: word }; }));
    var tiles = [];
    thaiTiles.forEach(function (t) { tiles.push(t); });
    enTiles.forEach(function (t) { tiles.push(t); });
    tiles = shuffle(tiles);

    var grid = document.getElementById("match-grid");
    var selected = null;
    var solvedCount = 0;

    tiles.forEach(function (tile, idx) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "match-tile" + (tile.cls ? " " + tile.cls : "");
      btn.innerHTML = tile.cls === "thai" ? tile.label : escapeHtml(tile.label);
      btn.dataset.key = tile.key;
      btn.dataset.idx = idx;
      btn.addEventListener("click", function () {
        if (btn.classList.contains("solved")) return;
        if (tile.cls === "thai") playThai(tile.word);
        if (selected === btn) { btn.classList.remove("selected"); selected = null; return; }
        if (!selected) { selected = btn; btn.classList.add("selected"); return; }
        if (selected.dataset.key === btn.dataset.key && selected !== btn) {
          selected.classList.remove("selected"); selected.classList.add("solved");
          btn.classList.add("solved");
          beep(true);
          solvedCount += 2;
          selected = null;
          if (solvedCount === tiles.length) {
            s.xp += 20;
            document.getElementById("match-done").hidden = false;
            setTimeout(function () { s.pos += 1; renderExercise(); }, 900);
          }
        } else {
          beep(false);
          [selected, btn].forEach(function (b) { b.classList.add("shake"); });
          setTimeout(function () {
            selected.classList.remove("selected", "shake"); btn.classList.remove("shake"); selected = null;
          }, 350);
        }
      });
      grid.appendChild(btn);
    });
  }

  /* =========================================================
     FINISH / FAIL
  ========================================================= */
  function finishLesson() {
    var s = state.session;
    var lesson = GROUPS[s.groupIndex].lessons[s.lessonIndex];
    var stars = s.mistakes === 0 ? 3 : s.mistakes <= 2 ? 2 : 1;
    var p = progress();
    var prevStars = starsFor(p, lesson.id);
    p.stars[lesson.id] = Math.max(prevStars, stars);
    p.xp += s.xp;
    p = bumpStreak(p);
    saveProgress(state.profile, p);
    updateStatPills();

    showView("summary");
    var starsHtml = "";
    for (var si = 0; si < 3; si++) starsHtml += '<span class="' + (si < stars ? "on" : "") + '">★</span>';
    summaryEl.innerHTML = '<div class="summary-card"><img class="summary-mascot" src="art/mascot.png" alt="" width="150" height="150" />' +
      "<h2>" + (stars === 3 ? "Perfect lesson!" : stars === 2 ? "Great job!" : "Lesson complete") + "</h2>" +
      '<div class="stars-big" aria-label="' + stars + ' of 3 stars">' + starsHtml + "</div>" +
      '<div class="xp-line"><span class="xp-chip">+' + s.xp + " XP</span></div>" +
      '<div class="summary-actions">' +
      '<button class="chunky plain" id="retry-lesson" type="button">Do it again</button>' +
      '<button class="chunky" id="back-dash" type="button">Continue</button>' +
      "</div></div>";
    document.getElementById("back-dash").addEventListener("click", function () { showView("dashboard"); renderDashboard(); });
    document.getElementById("retry-lesson").addEventListener("click", function () { startLesson(s.groupIndex, s.lessonIndex); });
    launchConfetti(stars === 3 ? 60 : 30);
  }

  function failLesson() {
    var s = state.session;
    showView("summary");
    summaryEl.innerHTML = '<div class="summary-card"><img class="summary-mascot sad" src="art/mascot.png" alt="" width="150" height="150" />' +
      "<h2>Out of hearts</h2>" +
      '<div class="xp-line">Take a breath and try this lesson again. You\'ll remember more the second time.</div>' +
      '<div class="summary-actions">' +
      '<button class="chunky plain" id="back-dash" type="button">Lesson map</button>' +
      '<button class="chunky" id="retry-lesson" type="button">Try again</button>' +
      "</div></div>";
    document.getElementById("back-dash").addEventListener("click", function () { showView("dashboard"); renderDashboard(); });
    document.getElementById("retry-lesson").addEventListener("click", function () { startLesson(s.groupIndex, s.lessonIndex); });
  }

  function launchConfetti(count) {
    var colors = ["#f2a024", "#0f8170", "#e0507a", "#3a72b8", "#5b9a2f"];
    for (var i = 0; i < count; i++) {
      (function () {
        var el = document.createElement("div");
        el.className = "confetti-piece";
        el.style.left = Math.random() * 100 + "vw";
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.animationDuration = 1.6 + Math.random() * 1.2 + "s";
        el.style.animationDelay = Math.random() * 0.3 + "s";
        document.body.appendChild(el);
        setTimeout(function () { el.remove(); }, 3200);
      })();
    }
  }

  /* =========================================================
     PROFILE SWITCH / BOOT
  ========================================================= */
  var profileDad = document.getElementById("profile-dad");
  var profileSon = document.getElementById("profile-son");
  function selectProfile(name) {
    state.profile = name;
    profileDad.setAttribute("aria-pressed", String(name === "dad"));
    profileSon.setAttribute("aria-pressed", String(name === "son"));
    renderDashboard();
  }
  profileDad.addEventListener("click", function () { selectProfile("dad"); });
  profileSon.addEventListener("click", function () { selectProfile("son"); });

  /* keyboard: 1-9 pick an answer, Enter checks it */
  document.addEventListener("keydown", function (e) {
    if (state.view !== "lesson" || e.altKey || e.ctrlKey || e.metaKey) return;
    if (e.target && e.target.tagName === "INPUT") return;
    if (/^[1-9]$/.test(e.key)) {
      var opt = lessonEl.querySelectorAll(".option-btn")[parseInt(e.key, 10) - 1];
      if (opt && !opt.disabled) { opt.click(); e.preventDefault(); }
    } else if (e.key === "Enter") {
      var chk = document.getElementById("check-btn");
      if (chk && !chk.disabled && document.activeElement !== chk) { chk.click(); e.preventDefault(); }
    }
  });

  renderDashboard();
})();
</script>
</body>
