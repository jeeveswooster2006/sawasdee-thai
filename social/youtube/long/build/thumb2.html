<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Mitr;font-weight:600;src:url(fonts/mitr-latin-600-normal.woff2)}
@font-face{font-family:Mitr;font-weight:600;src:url(fonts/mitr-latin-ext-600-normal.woff2);unicode-range:U+0100-024F,U+1E00-1EFF}
*{margin:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#EEF5F0;font-family:Mitr}
.row{position:absolute;left:0;right:0;bottom:0;height:470px;display:flex}
.row div{flex:1;background-size:cover;background-position:center 35%;border-left:6px solid #fff}
.row div:first-child{border-left:0}
.top{position:absolute;left:0;right:0;top:0;height:250px;background:linear-gradient(180deg,#fff,#EEF5F0);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px}
h1{font-weight:600;font-size:84px;line-height:1;color:#E0507A;letter-spacing:-1px}
h2{font-weight:600;font-size:50px;color:#007767;margin-top:14px}
.trim{position:absolute;left:0;right:0;top:244px;height:16px;background:radial-gradient(circle,#007767 6px,transparent 7px) 0 0/48px 16px,radial-gradient(circle,#E0507A 6px,transparent 7px) 16px 0/48px 16px,radial-gradient(circle,#F2A024 6px,transparent 7px) 32px 0/48px 16px;z-index:2}
</style></head><body>
<div class="top"><h1 id="h1"></h1><h2 id="h2"></h2></div><div class="trim"></div><div class="row" id="row"></div>
<script>
const P = JSON.parse(decodeURIComponent(location.hash.slice(1)));
h1.textContent = P.h1; h2.textContent = P.h2;
for (const f of P.frames) { const d = document.createElement("div"); d.style.backgroundImage = `url(${f})`; row.appendChild(d); }
document.fonts.ready.then(()=>{window.READY=true})
</script></body></html>
