<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Mitr;font-weight:600;src:url(fonts/mitr-latin-600-normal.woff2)}
@font-face{font-family:Mitr;font-weight:500;src:url(fonts/mitr-latin-500-normal.woff2)}
@font-face{font-family:Sarabun;font-weight:600;src:url(fonts/sarabun-latin-600-normal.woff2)}
*{margin:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;background:transparent;overflow:hidden;font-family:Sarabun}
.side{position:absolute;top:0;bottom:0;width:656px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:40px}
.l{left:0}.r{right:0}
.card{background:rgba(255,255,255,.93);border-radius:44px;padding:40px 44px;text-align:center;box-shadow:0 18px 50px rgba(18,59,55,.25);width:520px}
h1{font-family:Mitr;font-weight:600;font-size:70px;line-height:1.05;color:#007767}
h1 span{color:#E0507A}
.sub{font-family:Mitr;font-weight:500;font-size:34px;color:#123B37;margin-top:18px;line-height:1.25}
.langs{font-size:30px;color:#4F6B66;margin-top:16px;font-weight:600}
.trim{height:16px;margin:22px auto 0;width:300px;background:radial-gradient(circle,#007767 6px,transparent 7px) 0 0/48px 16px,radial-gradient(circle,#E0507A 6px,transparent 7px) 16px 0/48px 16px,radial-gradient(circle,#F2A024 6px,transparent 7px) 32px 0/48px 16px}
.friends{display:flex;justify-content:center;gap:4px;margin-top:6px}
.friends img{width:96px;height:96px;object-fit:contain}
.link{font-family:Mitr;font-weight:600;font-size:46px;color:#fff;background:#007767;border-radius:999px;padding:18px 40px;box-shadow:0 10px 0 #005a4e;margin-top:22px;display:inline-block}
.free{font-family:Mitr;font-weight:500;font-size:30px;color:#123B37;margin-top:28px}
</style></head><body>
<div class="side l"><div class="card"><h1>Merry<br><span>Christmas!</span></h1><div class="sub">Say it in 5 languages with Nong Chang &amp; Family</div><div class="trim"></div><div class="langs">Thai · French · Spanish<br>Italian · English</div></div></div>
<div class="side r"><div class="card"><div class="friends"><img src="cut-th.webp"><img src="cut-fr.webp"><img src="cut-es.webp"><img src="cut-it.webp"><img src="cut-en.webp"></div><div class="free">Learn a language together as a family</div><div class="link">nongchang.co.uk</div><div class="free" style="margin-top:26px;font-size:28px;color:#4F6B66">Free · no ads · works on any phone</div></div></div>
<script>document.fonts.ready.then(()=>{window.READY=true})</script>
</body></html>
