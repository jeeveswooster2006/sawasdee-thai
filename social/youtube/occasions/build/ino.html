<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Mitr;font-weight:600;src:url(mitr-latin-600-normal.woff2)}
@font-face{font-family:Mitr;font-weight:600;src:url(mitr-thai-600-normal.woff2);unicode-range:U+0E01-0E5B}
@font-face{font-family:Mitr;font-weight:500;src:url(mitr-latin-500-normal.woff2)}
@font-face{font-family:Sarabun;font-weight:600;src:url(sarabun-latin-600-normal.woff2)}
@font-face{font-family:Sarabun;font-weight:600;src:url(sarabun-latin-ext-600-normal.woff2);unicode-range:U+0100-02FF,U+0300-036F}
@font-face{font-family:Sarabun;font-weight:600;src:url(sarabun-thai-600-normal.woff2);unicode-range:U+0E01-0E5B}
*{margin:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:transparent;font-family:Mitr,"Noto Color Emoji";color:#123B37}
.abs{position:absolute}
.pill{background:#F2A024;color:#fff;font-weight:600;border-radius:999px;white-space:nowrap;box-shadow:0 10px 0 #d98a12;text-shadow:0 4px 0 rgba(0,0,0,.12)}
.card{background:#fff;border-radius:48px;box-shadow:0 12px 0 #D3EFE7, 0 20px 50px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#cap{left:60px;right:60px;bottom:150px;background:#fff;border-radius:44px;padding:28px 40px;font-family:Sarabun;font-weight:600;font-size:52px;line-height:1.25;text-align:center;box-shadow:0 10px 0 #D3EFE7, 0 16px 40px rgba(0,0,0,.18);transform-origin:50% 100%}
.conf{position:absolute;width:24px;height:24px;border-radius:6px}
.m{position:absolute;border-radius:50%;background:#F6EFE0;border:10px solid #F3E2B0;overflow:hidden;width:190px;height:190px}
.m img{width:100%;height:100%;display:block}
#end{position:absolute;inset:0;background:#EEF5F0;display:none;flex-direction:column;align-items:center;justify-content:center}
.trim{position:absolute;left:0;right:0;height:22px;background:
 radial-gradient(circle at 16px 11px,#007767 8px,transparent 9px) 0 0/96px 22px repeat-x,
 radial-gradient(circle at 48px 11px,#E0507A 8px,transparent 9px) 0 0/96px 22px repeat-x,
 radial-gradient(circle at 80px 11px,#F2A024 8px,transparent 9px) 0 0/96px 22px repeat-x}
</style></head><body>
<div id="bgconf"></div><div id="trims" style="display:none"><div class="trim" style="top:28px"></div><div class="trim" style="bottom:28px"></div></div>
<div id="title" class="abs pill" style="top:100px;left:50%;font-size:80px;padding:18px 56px">Spain's joke day! 🤭</div>
<div id="flag" class="abs pill" style="top:250px;left:50%;font-size:46px;padding:10px 34px;background:#007767;box-shadow:0 8px 0 #005a4e"></div>
<div id="word" class="abs card" style="left:50%;width:900px;padding:34px 30px"></div>
<div id="turn" class="abs pill" style="left:50%;font-size:86px;padding:16px 56px;background:#E0507A;box-shadow:0 10px 0 #b83a5f">Your turn! 🎤</div>
<div id="cap" class="abs"></div>
<div id="burst"></div>
<div id="end"><div class="trim" style="top:28px"></div><div class="trim" style="bottom:28px"></div>
  <div id="eh" style="font-weight:600;font-size:96px">Learn with us!</div>
  <div id="erow" style="position:relative;width:1000px;height:260px;margin:50px 0"></div>
  <div id="eu" style="background:#007767;color:#fff;font-weight:600;font-size:74px;padding:20px 50px;border-radius:999px;box-shadow:0 10px 0 #005a4e">nongchang.co.uk</div>
  <div style="margin-top:36px;font-size:50px;color:#F2A024;font-weight:600">Free · no ads · for the whole family</div>
  <div style="margin-top:22px;font-size:44px;font-weight:600">Thai · French · Spanish · Italian · English</div>
  <div id="cta" style="display:none;margin-top:44px;background:#E0507A;color:#fff;font-weight:600;font-size:56px;padding:16px 44px;border-radius:999px;box-shadow:0 10px 0 #b83a5f">👆 Link in bio: try a free lesson!</div>
</div>
<script>
if(new URLSearchParams(location.search).get('cta')==='1') document.addEventListener('DOMContentLoaded',()=>{const c=document.getElementById('cta'); if(c) c.style.display='block';});
const K = new URLSearchParams(location.search).get('m') || 'co';
const CFG = {
  co: {flag:'🇫🇷 French', word:"Joyeux Noël&nbsp;!", rom:'', mean:"Merry Christmas!", wordY:1390, turnY:1110},
  lu: {flag:'🇮🇹 Italian', word:'Buon Natale!', rom:'', mean:"Merry Christmas!", wordY:1390, turnY:1110},
  to: {flag:'🇪🇸 Spanish', word:'¡Feliz Navidad!', rom:'', mean:"Merry Christmas!", wordY:1390, turnY:1110},
  le: {flag:'🇬🇧 English', word:"Merry Christmas!", rom:'', mean:'Happy Christmas!', wordY:1390, turnY:1110},
  ino: {flag:'🇪🇸 28 December · Día de los Inocentes', word:'¡Inocente, inocente!', rom:'', mean:'Gotcha! You fell for it!', wordY:1390, turnY:1110},
  ny: {flag:'🇹🇭 Thai', word:'สุขสันต์วันคริสต์มาส', rom:'sùk-sǎn wan khrít-sà-mâat', mean:'Merry Christmas!', wordY:1290, turnY:880},
};
const C = CFG[K]; let TL;
const $ = (id) => document.getElementById(id);
const clamp = (x,a=0,b=1) => Math.max(a,Math.min(b,x));
const easeBack = (x) => { x = clamp(x); const c=1.9; return 1 + (c+1)*Math.pow(x-1,3) + c*Math.pow(x-1,2); };
const ease = (x) => { x = clamp(x); return 1 - Math.pow(1-x,3); };
const PAL=['#F2A024','#E0507A','#007767','#5BB8F0','#9B6BEA','#3CB371'];
function rand(i){ const x=Math.sin(i*127.1+(K==='co'?3:7)*31.7)*43758.5453; return x-Math.floor(x); }
$('flag').textContent = C.flag; if(K==='ny') $('trims').style.display='block';
$('word').innerHTML = `<div style="font-family:${K==='ny'?'Sarabun':'Mitr'};font-weight:600;font-size:${K==='ny'?92:96}px;line-height:1.2;color:#007767">${C.word}</div>`
  + (C.rom?`<div style="font-family:Sarabun;font-weight:600;font-size:60px;color:#4F6B66;margin-top:6px">${C.rom}</div>`:'')
  + `<div style="font-weight:600;font-size:52px;color:#E0507A;margin-top:8px">= ${C.mean}</div>`;
// burst confetti
const burst=[]; for(let i=0;i<70;i++){ const c=document.createElement('div'); c.className='conf'; c.style.background=PAL[i%6]; c.style.display='none'; $('burst').appendChild(c); burst.push({el:c,a:rand(i)*Math.PI*2,v:500+rand(i+50)*1000,r:rand(i+90)*720}); }
// slow falling confetti during the freeze frame
const fall=[]; for(let i=0;i<45;i++){ const c=document.createElement('div'); c.className='conf'; c.style.background=K==='ino'?PAL[i%6]:'#fff'; c.style.borderRadius=K==='ino'?'6px':'50%'; const sz=10+rand(i+600)*18; c.style.width=c.style.height=sz+'px'; c.style.boxShadow='0 0 8px rgba(255,255,255,.9)'; c.style.opacity=.95; $('bgconf').appendChild(c); fall.push({el:c,x:rand(i+200)*1080,y:rand(i+300)*1920,v:120+rand(i+400)*160,r:rand(i+500)*360}); }
const endM=[]; ['th','fr','es','it','en'].forEach((k,i)=>{ const d=document.createElement('div'); d.className='m'; d.innerHTML=`<img src="m-${k}.png">`; $('erow').appendChild(d); endM.push(d); });
function place(el,x,y,s,r=0,op=1){ el.style.left=x+'px'; el.style.top=y+'px'; el.style.transform=`translate(-50%,-50%) scale(${s}) rotate(${r}deg)`; el.style.opacity=op; }
window.renderAt=function(t){
  const end = t>=TL.end;
  $('end').style.display = end?'flex':'none';
  // title + flag
  place($('title'),540,140,end?0:easeBack(t/0.6),Math.sin(t*2.2)*2.5);
  place($('flag'),540,262,end?0:easeBack((t-0.3)/0.6),0);
  // word card: in on the first saying, pulse while it is said, stays to the end card
  const w0=TL.word[0]; const wIn=easeBack((t-w0+0.15)/0.45);
  const saying = TL.word.some(s=>t>s && t<s+1.4);
  place($('word'),540,C.wordY, (t<w0-0.15||end)?0:wIn*(saying?1+0.05*Math.sin(t*16):1), Math.sin(t*2)*1.5);
  // your turn
  const tu=TL.turn||10.3; place($('turn'),540,C.turnY,(t<tu||end)?0:easeBack((t-tu)/0.4)*(1+0.05*Math.sin(t*7)),Math.sin(t*5)*3);
  // caption
  const c = TL.clips.filter(c=>c.text && t>=c.start-0.1 && t<c.start+c.dur+0.35).pop(); const cap=$('cap');
  if(!c||end){cap.style.opacity=0;} else { if(cap.dataset.k!==c.name+c.start){cap.dataset.k=c.name+c.start;cap.textContent=c.text;} cap.style.opacity=1; cap.style.transform=`scale(${0.6+0.4*easeBack((t-c.start+0.1)/0.35)})`; }
  // confetti
  burst.forEach(b=>{ const u=t-w0; if(u<0||u>2.4||end){b.el.style.display='none';return;} b.el.style.display='block'; const x=540+Math.cos(b.a)*b.v*u, y=C.wordY-60+Math.sin(b.a)*b.v*u+900*u*u; b.el.style.transform=`translate(${x}px,${y}px) rotate(${b.r*u}deg)`; b.el.style.opacity=clamp(2.4-u); });
  fall.forEach(f=>{ const u=t-TL.clipEnd; if(u<0||end){f.el.style.display='none';return;} f.el.style.display='block'; const y=((f.y+f.v*u)%2000)-40; f.el.style.transform=`translate(${f.x+Math.sin(u+f.r)*30}px,${y}px) rotate(${f.r+u*120}deg)`; });
  // end card
  if(end){ const u=t-TL.end; $('eh').style.transform=`scale(${easeBack(u/0.5)}) rotate(${Math.sin(t*3)*2}deg)`;
    endM.forEach((d,i)=>{ d.style.left=(100+i*200)+'px'; d.style.top='130px'; d.style.transform=`translate(-50%,-50%) scale(${easeBack((u-0.15*i)/0.5)}) translateY(${Math.sin(t*6+i)*14}px)`; });
    $('eu').style.transform=`scale(${easeBack((u-0.6)/0.5)*(1+0.04*Math.sin(t*5))})`; }
};
fetch(`tl-x${K}.json`).then(r=>r.json()).then(async j=>{ TL=j;
  await Promise.all(['600 40px Mitr','500 40px Mitr','600 40px Sarabun','600 40px "Noto Color Emoji"'].map(f=>document.fonts.load(f,'Aa สุขสันต์ à ǎ 🎤🎄')));
  await Promise.all(['th','fr','es','it','en'].map(k=>{const i=new Image(); i.src=`m-${k}.png`; return i.decode().catch(()=>{});}));
  await document.fonts.ready; await Promise.all([...document.images].map(i=>i.decode().catch(()=>{}))); renderAt(0); window.READY=true; });
</script></body></html>
